basePath: /api/v1
definitions:
  errorresponse.ErrorResponse:
    properties:
      detail:
        type: string
    type: object
  handler.AccessTokenResponse:
    properties:
      access_token:
        type: string
    type: object
  handler.CreateItemRequest:
    properties:
      description:
        type: string
      price:
        type: number
      title:
        type: string
    type: object
  handler.ImagesResponse:
    properties:
      id:
        type: integer
      image_url:
        type: string
    type: object
  handler.ItemDetailResponse:
    properties:
      description:
        type: string
      id:
        type: integer
      price:
        type: number
      title:
        type: string
    type: object
  handler.ItemResponse:
    properties:
      id:
        type: integer
      price:
        type: number
      title:
        type: string
    type: object
  handler.RegisterAndLoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  handler.UploadImageResponse:
    properties:
      image_url:
        type: string
    type: object
  handler.UserResponse:
    properties:
      email:
        type: string
      id:
        type: integer
    type: object
info:
  contact: {}
  description: Avito clone API
  title: AvitoClone API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login with email and password
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RegisterAndLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AccessTokenResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errorresponse.ErrorResponse'
      summary: Login user
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register new user
      parameters:
      - description: Register request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RegisterAndLoginRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errorresponse.ErrorResponse'
      summary: Register user
      tags:
      - auth
  /images/{image_id}:
    delete:
      description: Delete image by id
      parameters:
      - description: Image ID
        in: path
        name: image_id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errorresponse.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errorresponse.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/errorresponse.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete image
      tags:
      - images
  /images/{item_id}:
    post:
      consumes:
      - multipart/form-data
      description: Upload image for item
      parameters:
      - description: Item ID
        in: path
        name: item_id
        required: true
        type: integer
      - description: Image file
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.UploadImageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errorresponse.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errorresponse.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload image
      tags:
      - images
  /items:
    get:
      consumes:
      - application/json
      description: List items
      parameters:
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.ItemResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errorresponse.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errorresponse.ErrorResponse'
      summary: List items
      tags:
      - items
    post:
      consumes:
      - application/json
      description: Create item
      parameters:
      - description: Create item request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateItemRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.ItemResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errorresponse.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errorresponse.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create item
      tags:
      - items
  /items/{id}:
    delete:
      consumes:
      - application/json
      description: Delete item
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errorresponse.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errorresponse.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete item
      tags:
      - items
    get:
      consumes:
      - application/json
      description: Get item by id
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ItemDetailResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errorresponse.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errorresponse.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get item by id
      tags:
      - items
  /items/{id}/images:
    get:
      description: Get images for item
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.ImagesResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errorresponse.ErrorResponse'
      summary: Get item images
      tags:
      - images
  /items/me:
    get:
      consumes:
      - application/json
      description: List my items
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.ItemResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errorresponse.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errorresponse.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List my items
      tags:
      - items
  /users/{user_id}/items:
    get:
      consumes:
      - application/json
      description: List items by user id
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.ItemResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errorresponse.ErrorResponse'
      summary: List items by user id
      tags:
      - items
  /users/me:
    get:
      consumes:
      - application/json
      description: Returns current authorized user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errorresponse.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - users
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
